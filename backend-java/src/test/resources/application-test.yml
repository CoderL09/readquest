spring:
  datasource:
    url: jdbc:h2:mem:readquest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
readquest:
  jwt-secret: test-only-secret-with-at-least-thirty-two-characters
  secure-cookie: false
  rate-limits:
    enabled: false
  maintenance:
    enabled: false
  import-worker:
    enabled: false
  storage-root: ./target/test-book-files
  dictionary-root: ./target/test-dictionary-files
  avatar-root: ./target/test-avatar-files
  mail:
    worker-delay-ms: 86400000
management:
  server:
    port: -1
